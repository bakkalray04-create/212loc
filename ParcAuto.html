<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>ParcAuto</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F3F6FC; --surface:#FFFFFF; --surface-2:#F6F9FE; --line:#E3E9F5; --line-strong:#C6D0E6;
  --ink:#0E1426; --ink-2:#4A5570; --ink-3:#79849E;
  --accent:#2F5BEA; --accent-2:#FF6B4A; --accent-3:#12B6A0;
  --accent-soft:#E8EDFE; --accent-ink:#1E3FB8; --on-accent:#FFFFFF;
  --ok:#0E9F6E; --ok-soft:#E0F5EC;
  --warn:#C1780C; --warn-soft:#FCF0DC;
  --crit:#D93B3B; --crit-soft:#FCE7E6;
  --idle:#5C6AA6; --idle-soft:#E9ECF9;
  --glow:rgba(47,91,234,.28);
  --shadow:0 1px 2px rgba(14,20,38,.05), 0 8px 24px -14px rgba(14,20,38,.30);
  --shadow-lift:0 2px 6px rgba(14,20,38,.06), 0 22px 46px -22px rgba(47,91,234,.38);
  --r:12px; --r-s:9px;
  --f-display:'Archivo','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,.8,.28,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#080B15; --surface:#111726; --surface-2:#161D2F; --line:#222A41; --line-strong:#37415F;
  --ink:#ECF0F9; --ink-2:#A4AEC7; --ink-3:#7581A0;
  --accent:#6D8CFF; --accent-2:#FF8464; --accent-3:#2ED3BB;
  --accent-soft:#182348; --accent-ink:#A9BEFF; --on-accent:#080B15;
  --ok:#3FD69A; --ok-soft:#0D2A20;
  --warn:#F0B44E; --warn-soft:#2E2313;
  --crit:#FF7A75; --crit-soft:#331817;
  --idle:#98A4D6; --idle-soft:#1A2036;
  --glow:rgba(109,140,255,.35);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.9);
  --shadow-lift:0 2px 8px rgba(0,0,0,.55), 0 26px 52px -26px rgba(109,140,255,.5);
}}
:root[data-theme="dark"]{
  --ground:#080B15; --surface:#111726; --surface-2:#161D2F; --line:#222A41; --line-strong:#37415F;
  --ink:#ECF0F9; --ink-2:#A4AEC7; --ink-3:#7581A0;
  --accent:#6D8CFF; --accent-2:#FF8464; --accent-3:#2ED3BB;
  --accent-soft:#182348; --accent-ink:#A9BEFF; --on-accent:#080B15;
  --ok:#3FD69A; --ok-soft:#0D2A20;
  --warn:#F0B44E; --warn-soft:#2E2313;
  --crit:#FF7A75; --crit-soft:#331817;
  --idle:#98A4D6; --idle-soft:#1A2036;
  --glow:rgba(109,140,255,.35);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 10px 30px -18px rgba(0,0,0,.9);
  --shadow-lift:0 2px 8px rgba(0,0,0,.55), 0 26px 52px -26px rgba(109,140,255,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
[dir="rtl"] #app{direction:rtl}
aside{background:var(--surface);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:20px 18px 16px;display:flex;gap:10px;align-items:center}
.mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);box-shadow:0 4px 14px -4px var(--glow);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;flex:none}

.brand b{font-family:var(--f-display);font-size:16px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--ink-3);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
nav{padding:6px 10px;display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1}
.navlabel{font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);padding:14px 8px 6px;font-weight:600}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;background:none;border:0;border-radius:var(--r-s);cursor:pointer;color:var(--ink-2);text-align:start;font-size:13.5px}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
nav button .ic{width:16px;flex:none;opacity:.9}
nav button .badge{margin-inline-start:auto;background:var(--crit);color:#fff;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:20px;font-family:var(--f-mono)}
.agency{border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--idle-soft);color:var(--idle);display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
main{min-width:0;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px}
header h1{font-family:var(--f-display);font-size:19px;margin:0;letter-spacing:-.015em}
header .sub{color:var(--ink-3);font-size:12.5px;margin-top:1px}
.spacer{flex:1}
.tbtn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:6px 11px;cursor:pointer;color:var(--ink-2);font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.tbtn:hover{border-color:var(--line-strong);color:var(--ink)}
.tbtn.primary{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 72%,var(--accent-2)));border-color:transparent;color:var(--on-accent);font-weight:600;box-shadow:0 4px 16px -6px var(--glow)}

.tbtn.primary:hover{filter:brightness(1.08)}
.wrap{padding:22px 26px 60px;display:flex;flex-direction:column;gap:18px}

/* ---------- primitives ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card>h3{margin:0;padding:13px 16px;border-bottom:1px solid var(--line);font-family:var(--f-display);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card>h3 .spacer{flex:1}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.kpi{padding:14px 16px}
.kpi .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:27px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--ink-3);margin-top:2px}
.kpi .bar{height:4px;border-radius:3px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
.tscroll{overflow-x:auto}
th{text-align:start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface-2)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.plate{font-family:var(--f-mono);font-size:12px;font-weight:500;border:1px solid var(--line-strong);border-radius:4px;padding:2px 6px;white-space:nowrap;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2.5px 9px;border-radius:20px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.idle{background:var(--idle-soft);color:var(--idle)}
.pill.acc{background:var(--accent-soft);color:var(--accent-ink)}
.pill.flat::before{display:none}
.stripe{border-inline-start:3px solid var(--line);padding-inline-start:11px}
.stripe.crit{border-color:var(--crit)} .stripe.warn{border-color:var(--warn)} .stripe.ok{border-color:var(--ok)} .stripe.acc{border-color:var(--accent)}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:9px}
.stack{display:flex;flex-direction:column;gap:2px}
.list{display:flex;flex-direction:column}
.list>div{padding:11px 16px;border-bottom:1px solid var(--line)}
.list>div:last-child{border-bottom:0}
.empty{padding:34px;text-align:center;color:var(--ink-3);font-size:13px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:7px 10px;font-size:13px;min-width:0}
input:hover,select:hover{border-color:var(--line-strong)}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
label.fld>*{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:500}
.gauge{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.gauge i{display:block}
.spark{display:flex;align-items:flex-end;gap:4px;height:64px}
.spark i{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0;position:relative;min-height:3px}
.spark i.hi{background:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend b{width:9px;height:9px;border-radius:3px;display:block}
.two{display:grid;grid-template-columns:1.55fr 1fr;gap:14px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
@media(max-width:860px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}nav{flex-direction:row;flex-wrap:wrap}.navlabel,.agency{display:none}.wrap,header{padding-inline:14px}}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,12,14,.5);z-index:60;display:flex;justify-content:flex-end}
.drawer{background:var(--ground);width:min(760px,100%);height:100%;overflow-y:auto;border-inline-start:1px solid var(--line);animation:slide .22s ease}
@keyframes slide{from{transform:translateX(3%);opacity:.4}}
[dir="rtl"] .drawer{animation:slidr .22s ease}
@keyframes slidr{from{transform:translateX(-3%);opacity:.4}}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.dhead h2{font-family:var(--f-display);font-size:18px;margin:0;letter-spacing:-.015em}
.dbody{padding:18px 20px 50px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 20px;background:var(--surface);position:sticky;top:69px;z-index:2;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 11px;cursor:pointer;color:var(--ink-3);font-size:13px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
.modal{position:fixed;inset:0;background:rgba(8,12,14,.5);z-index:70;display:grid;place-items:center;padding:20px}
.sheet{background:var(--ground);border-radius:var(--r);width:min(720px,100%);max-height:90vh;overflow-y:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.5)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:13px}
.kv dt{color:var(--ink-3);font-size:12px}
.kv dd{margin:0;text-align:end}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
@media(max-width:620px){.formgrid{grid-template-columns:1fr}}
.formgrid .full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;padding:13px 16px;border-top:1px solid var(--line)}

/* ---------- contract ---------- */
.contract{background:#fff;color:#101418;padding:40px 44px;font-size:12.5px;line-height:1.6}
.contract h1{font-family:var(--f-display);font-size:20px;margin:0 0 2px;letter-spacing:-.01em}
.contract .ch{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #101418;padding-bottom:12px;margin-bottom:18px}
.contract h4{font-family:var(--f-display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;margin:18px 0 7px;color:#5a666e}
.contract table{font-size:12px}
.contract th,.contract td{border-bottom:1px solid #e2e7ea;padding:6px 8px;background:none;color:#101418}
.contract .sig{display:flex;gap:40px;margin-top:32px}
.contract .sig div{flex:1;border-top:1px solid #101418;padding-top:6px;font-size:11px;color:#5a666e}
.contract .terms{font-size:10.5px;color:#5a666e;margin-top:18px;columns:2;column-gap:26px}
@media print{body>*{display:none!important}body .printing{display:block!important;position:static}.printing .scrim,.printing .sheet{all:unset}.contract{padding:0}}

/* ---------- msg preview ---------- */
.phone{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.bubble{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px 12px 12px 3px;padding:10px 12px;font-size:12.5px;white-space:pre-wrap;max-width:92%;line-height:1.55}
.toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:20px;font-size:13px;z-index:90;box-shadow:var(--shadow)}
/* ---------- site public ---------- */
#app.site{display:block;min-height:100vh;background:var(--ground)}
.snav{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:12px 30px;background:color-mix(in srgb,var(--ground) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.snav .brand{padding:0}
.slink{color:var(--ink-2);text-decoration:none;font-size:13.5px;padding:6px 4px}
.slink:hover{color:var(--ink)}
.tbtn.big{padding:11px 20px;font-size:14px;border-radius:9px}
.tbtn.full{width:100%;justify-content:center;padding:9px}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:44px;align-items:center;max-width:1240px;margin:0 auto;padding:64px 30px 56px}
.eyebrow{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);padding:5px 11px;border-radius:20px}
.hero h1{font-family:var(--f-display);font-size:clamp(32px,4.4vw,54px);line-height:1.05;letter-spacing:-.03em;margin:18px 0 14px;text-wrap:balance}
.lede{font-size:16.5px;line-height:1.65;color:var(--ink-2);max-width:56ch;margin:0 0 24px}
.stats{display:flex;gap:34px;margin-top:34px;padding-top:24px;border-top:1px solid var(--line);flex-wrap:wrap}
.stats b{display:block;font-family:var(--f-display);font-size:24px;letter-spacing:-.02em}
.stats span{font-size:12.5px;color:var(--ink-3)}
.shot{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 70px -40px rgba(16,23,28,.55);overflow:hidden}
.shot-bar{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.shot-bar i{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.shot-bar span{margin-inline-start:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3)}
.shot-body{padding:14px;display:flex;flex-direction:column;gap:8px}
.sk-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sk-kpi{background:var(--surface-2);border-radius:8px;padding:9px 10px}
.sk-kpi span{display:block;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.sk-kpi b{font-family:var(--f-display);font-size:19px}
.sk-row{font-size:12px;padding:8px 11px;border-radius:7px;background:var(--surface-2);border-inline-start:3px solid var(--line)}
.sk-row.crit{border-color:var(--crit)}.sk-row.warn{border-color:var(--warn)}.sk-row.ok{border-color:var(--ok)}
.sk-spark{display:flex;align-items:flex-end;gap:5px;height:60px;margin-top:2px}
.sk-spark i{flex:1;background:var(--accent-soft);border-radius:3px 3px 0 0}
.sk-spark i.hi{background:var(--accent)}
.band{max-width:1240px;margin:0 auto;padding:56px 30px}
.band.alt{background:var(--surface);max-width:none;border-block:1px solid var(--line)}
.band.alt>*{max-width:1240px;margin-inline:auto}
.band h2{font-family:var(--f-display);font-size:clamp(24px,2.6vw,32px);letter-spacing:-.025em;margin:0 0 8px;text-wrap:balance}
.band .sub{color:var(--ink-2);margin:0 0 6px;font-size:15px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:26px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.band.alt .fcard{background:var(--ground)}
.fnum{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:500}
.fcard h3{font-family:var(--f-display);font-size:16px;margin:8px 0 7px;letter-spacing:-.01em}
.fcard p{margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.62}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(248px,1fr));gap:16px;align-items:start}
.pcard{background:var(--ground);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;position:relative;display:flex;flex-direction:column;gap:10px}
.pgrid.app .pcard{background:var(--surface)}
.pcard.best{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ribbon{position:absolute;top:-10px;inset-inline-start:20px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 10px;border-radius:20px}

.pcard h3{font-family:var(--f-display);font-size:19px;margin:0;letter-spacing:-.015em}
.ptag{font-size:12.5px;color:var(--ink-3);min-height:34px}
.price{display:flex;align-items:baseline;flex-wrap:wrap}
.pv{font-family:var(--f-display);font-size:36px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pu{font-size:13px;color:var(--ink-3);margin-inline-start:5px}
.pcap{font-size:12.5px;color:var(--ink-2);font-weight:500;padding-bottom:4px}
.plist{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px}
.plist li{font-size:12.8px;color:var(--ink-2);line-height:1.5;padding-inline-start:20px;position:relative}
.plist li::before{content:"✓";position:absolute;inset-inline-start:0;color:var(--ok);font-weight:600}
.plist li.no{color:var(--ink-3);opacity:.7}
.plist li.no::before{content:"—";color:var(--ink-3)}
.matrix{margin-top:26px;overflow-x:auto}
.faq{display:flex;flex-direction:column;gap:2px;margin-top:20px;max-width:820px}
.faq details{border-bottom:1px solid var(--line);padding:14px 2px}
.faq summary{cursor:pointer;font-weight:500;font-size:14.5px;list-style:none}

VIEWS.reports = () => {
  const rows = V.map(v => {
    const rev = revOf(v.id), cost = costOf(v.id);
    const dRented = R.filter(r => r.vid === v.id).reduce((s, r) => s + Math.round((D(r.to) - D(r.from)) / 864e5), 0);
    return { v, rev, cost, marge: rev - cost, occ: Math.min(100, Math.round(dRented / 180 * 100)) };
  }).sort((a, b) => b.marge - a.marge);
  const maxM = Math.max(1, ...rows.map(r => Math.abs(r.marge)));
  const topC = C.map(c => { const rs = R.filter(r => r.cid === c.id); return { c, n: rs.length, ca: rs.reduce((s, r) => s + rTotal(r), 0) }; }).sort((a, b) => b.ca - a.ca);
  const totRev = rows.reduce((s, r) => s + r.rev, 0), totCost = rows.reduce((s, r) => s + r.cost, 0);

  return el(`<div class="grid">
    <div class="grid kpis">
      ${kpi('Revenus locations', money(totRev), '12 derniers mois')}
      ${kpi('Charges parc', money(totCost), 'documents + atelier + franchises')}
      ${kpi('Marge nette', money(totRev - totCost), (totRev ? Math.round((totRev - totCost) / totRev * 100) : 0) + ' % du chiffre', (totRev ? Math.round((totRev - totCost) / totRev * 100) : 0), 'ok')}
      ${kpi('Taux d\'occupation moyen', (rows.length ? Math.round(rows.reduce((s, r) => s + r.occ, 0) / rows.length) : 0) + ' %', 'sur 6 mois', (rows.length ? Math.round(rows.reduce((s, r) => s + r.occ, 0) / rows.length) : 0), 'accent')}
    </div>
    <div class="two">
      <div class="card"><h3>${t('perVehicle')}</h3><div class="tscroll"><table>
        <thead><tr><th>${t('vehicle')}</th><th>Occupation</th><th>${t('revenueV')}</th><th>${t('totalCosts')}</th><th>${t('margin')}</th><th></th></tr></thead>
        <tbody>${rows.map(r => `<tr class="click" data-veh="${r.v.id}">
          <td><div class="row"><span class="plate">${r.v.plate}</span><span>${vname(r.v)}</span></div></td>
          <td><div class="row"><span class="num" style="width:38px">${r.occ}%</span><div class="bar" style="flex:1;min-width:60px;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden"><i style="display:block;height:100%;width:${r.occ}%;background:var(--accent);border-radius:3px"></i></div></div></td>

/* ---------- création de compte / connexion ---------- */
function authSheet(mode, pick) {
  const sel = pick || 'pro';
  const node = el(`<div class="modal"><div class="sheet" style="max-width:560px">
    <div style="padding:20px 20px 0"><b style="font-family:var(--f-display);font-size:18px">${mode === 'login' ? 'Connexion à votre espace' : 'Créer votre compte'}</b>
      <div class="muted small">${mode === 'login' ? 'Entrez vos identifiants d\'agence.' : '14 jours d\'essai, toutes les fonctions, sans carte bancaire.'}</div></div>
    <div class="formgrid">
      ${mode === 'signup' ? `<label class="fld full">Nom de l'agence<input type="text" id="a-co" value="Agence Atlas Cars"></label>
      <label class="fld">Votre nom<input type="text" id="a-nm" value="Abdelilah B."></label>
      <label class="fld">Ville<select id="a-city"><option>Casablanca</option><option>Rabat</option><option>Marrakech</option><option>Tanger</option><option>Agadir</option><option>Fès</option></select></label>` : ''}
      <label class="fld ${mode === 'login' ? 'full' : ''}">Email professionnel<input type="text" id="a-ml" value="contact@atlascars.ma"></label>
      <label class="fld ${mode === 'login' ? 'full' : ''}">Mot de passe (min. 6 caractères)<input type="password" id="a-pw" value="ParcAuto2026"></label>
      ${mode === 'signup' ? `<div class="full"><div class="fld" style="margin-bottom:8px">Formule</div>
        <div class="picks">${PLANS.map(p => `<button class="pick ${p.id === sel ? 'on' : ''}" data-p="${p.id}"><b>${p.name}</b><span>${p.price ? p.price + ' DH/mois' : 'Devis'}</span><span class="muted small">${p.cap}</span></button>`).join('')}</div></div>` : ''}
    </div>
    <div class="actions"><button class="tbtn" id="cx">Annuler</button><button class="tbtn primary" id="ok">${mode === 'login' ? 'Se connecter' : 'Démarrer l\'essai'}</button></div>
  </div></div>`);
  let chosen = sel;
  node.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { chosen = b.dataset.p; node.querySelectorAll('[data-p]').forEach(x => x.classList.toggle('on', x === b)); });
  node.onclick = e => { if (e.target === node) closeLayer(); };
  node.querySelector('#cx').onclick = closeLayer;
  node.querySelector('#ok').onclick = async () => {
    const email = (node.querySelector('#a-ml')?.value || '').trim();
    const pass = (node.querySelector('#a-pw')?.value || '').trim();
    if (!email || !email.includes('@')) { toast('Veuillez saisir un email professionnel valide'); return; }
    if (pass.length < 6) { toast('Le mot de passe doit contenir au moins 6 caractères'); return; }
    const cityVal = node.querySelector('#a-city')?.value || 'Casablanca';
    if (mode === 'signup') {
      A.isDemo = false;
      A.company = esc(node.querySelector('#a-co').value.trim()) || 'Mon Agence Auto';
      A.user = esc(node.querySelector('#a-nm').value.trim()) || 'Gérant';
      A.city = cityVal;
      A.address = cityVal + ', Maroc';
      A.legalName = A.company + ' SARL';
      A.ice = '';
      A.rc = '';
      A.phone = '';
      A.email = email;
      A.plan = chosen === 'surmesure' ? 'business' : chosen;
      A.trial = 14;
      // Une vraie agence démarre avec un parc vierge (aucune donnée fictive de démo)
      V.length = 0; DOCS.length = 0; C.length = 0; R.length = 0; M.length = 0; SIN.length = 0;
      try {
        const list = JSON.parse(localStorage.getItem('parcauto_admin_agencies') || '[]');
        if (!list.find(x => x.email.toLowerCase() === email.toLowerCase())) {
          list.unshift({ id: 'ag-' + Date.now(), company: A.company, city: cityVal, phone: A.phone || '', email, password: pass, plan: A.plan, trial_days: 14, suspended: false });
          localStorage.setItem('parcauto_admin_agencies', JSON.stringify(list));
        }
      } catch (e) {}
    }
    if (DB.url && DB.key) {
      try {
        const authUrl = DB.url.replace(/\/+$/, '') + '/auth/v1/' + (mode === 'signup' ? 'signup' : 'token?grant_type=password');
        const res = await fetch(authUrl, {
          method: 'POST',
          headers: { 'apikey': DB.key, 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password: pass, company: A.company, owner_name: A.user, city: cityVal, plan: A.plan })
        });
        const data = await res.json();
        if (!res.ok) {
          toast(data.msg || data.error_description || 'Identifiants incorrects ou compte existant');
          return;
        }
        const uid = data.user?.id || data.id;
        if (uid) DB.agencyId = uid;
        if (data.access_token) DB.token = data.access_token;
        saveDbConfig();
        if (mode === 'login') await pullFromCloud(true);
        else await syncToCloud(true);
      } catch (e) {
        toast('Erreur réseau avec le serveur d\'authentification');
        return;
      }
    }
    if (mode === 'login') {
      const localAgencies = JSON.parse(localStorage.getItem('parcauto_admin_agencies') || '[]');
      const found = localAgencies.find(x => x.email.toLowerCase() === email.toLowerCase());
      if (found) {
        if (found.suspended) { toast('Ce compte agence est suspendu par l\'administrateur.'); return; }
        if (found.password && found.password !== pass) { toast('Mot de passe incorrect'); return; }
        A.company = found.company; A.plan = found.plan || 'pro'; A.trial = found.trial_days ?? 30; A.email = found.email;
        if (found.empty_fleet) { V.length = 0; DOCS.length = 0; C.length = 0; R.length = 0; M.length = 0; SIN.length = 0; found.empty_fleet = false; localStorage.setItem('parcauto_admin_agencies', JSON.stringify(localAgencies)); }
      }
    }
    saveState();
    A.mode = 'app'; S.view = 'dash'; closeLayer(); render();
    toast(mode === 'signup' ? `Compte créé — formule ${planOf(A.plan).name}, essai de 14 jours` : 'Connecté en toute sécurité');
  };
  openLayer(node);
}

/* ---------- révélation au défilement + compteurs ---------- */
function reveal() {
  const items = [...document.querySelectorAll('.rv')];
  if (!('IntersectionObserver' in window)) { items.forEach(i => i.classList.add('in')); return; }
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in'); io.unobserve(e.target);
    e.target.querySelectorAll('[data-count]').forEach(count);
  }), { rootMargin: '0px 0px -8% 0px', threshold: .12 });
  items.forEach(i => io.observe(i));
}
function count(n) {
  const to = +n.dataset.count, sfx = n.dataset.suffix || '', t0 = performance.now(), dur = 1100;
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    n.textContent = new Intl.NumberFormat('fr-MA').format(Math.round(to * e)) + sfx;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

const SQL_SCHEMA = '-- ============================================================================\n-- PARCAUTO MAROC — SCHÉMA POSTGRESQL COMPLET (SUPABASE MULTI-AGENCES + RLS)\n-- Exécutez ce script dans l\'éditeur SQL de Supabase (SQL Editor -> New Query)\n-- ============================================================================\n\ncreate extension if not exists "pgcrypto";\n\n-- 1. TABLE DES AGENCES (Multi-tenant : chaque compte client = 1 agence isolée)\ncreate table if not exists public.agencies (\n  id uuid primary key default gen_random_uuid(),\n  owner_id uuid unique references auth.users(id) on delete cascade,\n  company text not null default \'Mon Agence Auto\',\n  legal_name text,\n  ice text,\n  rc text,\n  city text default \'Casablanca\',\n  address text,\n  phone text,\n  email text,\n  plan text not null default \'pro\',\n  period text not null default \'month\',\n  trial_days integer not null default 14,\n  tva numeric(5,2) not null default 20.00,\n  state_snapshot jsonb,\n  updated_at timestamptz not null default now(),\n  created_at timestamptz not null default now()\n);\n\n-- 2. TABLE DES VÉHICULES\ncreate table if not exists public.vehicles (\n  id text not null,\n  agency_id uuid not null references public.agencies(id) on delete cascade,\n  plate text not null,\n  brand text not null,\n  model text not null,\n  year integer not null default 2026,\n  color text,\n  fuel text default \'Diesel\',\n  box text default \'Manuelle\',\n  vin text,\n  km integer not null default 0,\n  buy_date date,\n  buy_price numeric(12,2) default 0,\n  supplier text,\n  warranty_end date,\n  daily_rate numeric(10,2) not null default 250,\n  status text not null default \'available\',\n  created_at timestamptz not null default now(),\n  primary key (agency_id, id)\n);\n\n-- 3. TABLE DES DOCUMENTS ET ÉCHÉANCES (Assurance, Vignette, Visite technique, Carte grise)\ncreate table if not exists public.vehicle_documents (\n  id text not null,\n  agency_id uuid not null references public.agencies(id) on delete cascade,\n  vid text not null,\n  kind text not null,\n  due_date date not null,\n  org text,\n  cost numeric(10,2) not null default 0,\n  created_at timestamptz not null default now(),\n  primary key (agency_id, id)\n);\n\n-- 4. TABLE DES CLIENTS LOCATAIRES\ncreate table if not exists public.clients (\n  id text not null,\n  agency_id uuid not null references public.agencies(id) on delete cascade,\n  name text not null,\n  phone text not null,\n  cin text not null,\n  licence text not null,\n  email text,\n  since_date date default current_date,\n  created_at timestamptz not null default now(),\n  primary key (agency_id, id)\n);\n\n-- 5. TABLE DES CONTRATS DE LOCATION\ncreate table if not exists public.rentals (\n  id text not null,\n  agency_id uuid not null references public.agencies(id) on delete cascade,\n  vid text not null,\n  cid text not null,\n  date_from date not null,\n  date_to date not null,\n  daily_rate numeric(10,2) not null,\n  deposit numeric(10,2) not null default 3000,\n  km_out integer not null default 0,\n  km_in integer,\n  place text default \'Agence Casablanca\',\n  created_at timestamptz not null default now(),\n  primary key (agency_id, id)\n);\n\n-- 6. TABLE DES MAINTENANCES & RÉPARATIONS ATELIER\ncreate table if not exists public.maintenances (\n  id text not null,\n  agency_id uuid not null references public.agencies(id) on delete cascade,\n  vid text not null,\n  maint_date date not null default current_date,\n  type text not null,\n  description text,\n  cost numeric(10,2) not null default 0,\n  garage text,\n  km integer default 0,\n  status text not null default \'open\',\n  created_at timestamptz not null default now(),\n  primary key (agency_id, id)\n);\n\n-- 7. TABLE DES SINISTRES & DOSSIERS D\'ASSURANCE\ncreate table if not exists public.claims (\n  id text not null,\n  agency_id uuid not null references public.agencies(id) on delete cascade,\n  vid text not null,\n  claim_date date not null default current_date,\n  ref text not null,\n  driver text,\n  place text,\n  responsibility text default \'Tiers\',\n  damage text,\n  amount numeric(10,2) not null default 0,\n  insurer text,\n  status text not null default \'open\',\n  created_at timestamptz not null default now(),\n  primary key (agency_id, id)\n);\n\n-- 8. TABLE DES DEMANDES DE DÉMO / PROSPECTS (depuis le site vitrine public)\ncreate table if not exists public.leads (\n  id uuid primary key default gen_random_uuid(),\n  agency_name text not null,\n  city text,\n  phone text not null,\n  fleet_size text,\n  message text,\n  created_at timestamptz not null default now()\n);\n\n-- ============================================================================\n-- SÉCURITÉ MULTI-AGENCES (ROW LEVEL SECURITY — RLS)\n-- Garantit que chaque agence connectée n\'accède qu\'à ses propres données\n-- ============================================================================\nalter table public.agencies enable row level security;\nalter table public.vehicles enable row level security;\nalter table public.vehicle_documents enable row level security;\nalter table public.clients enable row level security;\nalter table public.rentals enable row level security;\nalter table public.maintenances enable row level security;\nalter table public.claims enable row level security;\nalter table public.leads enable row level security;\n\n-- Politiques strictes Multi-Agences : chaque agence connectée (auth.uid()) ne voit et ne modifie QUE ses propres données\ncreate policy "Agences_isolees" on public.agencies for all using (auth.uid() = id or owner_id = auth.uid()) with check (auth.uid() = id or owner_id = auth.uid());\ncreate policy "Vehicles_isoles" on public.vehicles for all using (agency_id = auth.uid()) with check (agency_id = auth.uid());\ncreate policy "Docs_isoles" on public.vehicle_documents for all using (agency_id = auth.uid()) with check (agency_id = auth.uid());\ncreate policy "Clients_isoles" on public.clients for all using (agency_id = auth.uid()) with check (agency_id = auth.uid());\ncreate policy "Rentals_isoles" on public.rentals for all using (agency_id = auth.uid()) with check (agency_id = auth.uid());\ncreate policy "Maint_isoles" on public.maintenances for all using (agency_id = auth.uid()) with check (agency_id = auth.uid());\ncreate policy "Claims_isoles" on public.claims for all using (agency_id = auth.uid()) with check (agency_id = auth.uid());\n-- Les visiteurs publics peuvent uniquement ENVOYER une demande de démo (impossible de lire les demandes des autres)\ncreate policy "Leads_insertion_seule" on public.leads for insert with check (true);\n';

function saveDbConfig() {
  try {
    localStorage.setItem('parcauto_db_cfg', JSON.stringify({
      url: DB.url, key: DB.key, agencyId: DB.agencyId, token: DB.token, lastSync: DB.lastSync
    }));
  } catch (e) {}
}

// Auto-détection du serveur Back-End (server.js) au démarrage
async function autoDetectBackend() {
  if (!location.protocol.startsWith('http')) return;
  const candidateUrl = DB.url || location.origin;
  try {
    const res = await fetch(candidateUrl.replace(/\/+$/, '') + '/api/health');
    if (res.ok) {
      DB.url = candidateUrl.replace(/\/+$/, '');
      if (!DB.key) DB.key = 'parcauto-public-client';
      saveDbConfig();
      if (DB.token && DB.agencyId) {
        await pullFromCloud(true);
      }
    }
  } catch (e) {}
}
setTimeout(autoDetectBackend, 150);

function dbHeaders() {
  return {
    'apikey': DB.key,
    'Authorization': 'Bearer ' + (DB.token || DB.key),
    'Content-Type': 'application/json',
    'Prefer': 'resolution=merge-duplicates,return=minimal'
  };
}

async function syncToCloud(silent = false) {
  if (A.isDemo) return false;
  if (!DB.url || (!DB.key && !DB.token)) {
    if (!silent) dbConfigModal();
    return false;
  }
  if (!DB.agencyId) return false;
  const base = DB.url.replace(/\/+$/, '') + '/rest/v1';
  try {
    if (!silent) toast('Synchronisation avec PostgreSQL en cours…');
    // 1. Upsert Agency profile (toutes les colonnes + snapshot JSONB)
    const agRes = await fetch(base + '/agencies?on_conflict=id', {
      method: 'POST',
      headers: dbHeaders(),
      body: JSON.stringify([{
        id: DB.agencyId,
        company: A.company || 'Mon Agence Auto',
        owner_name: A.user || 'Gérant',
        legal_name: A.legalName ?? (A.company + ' SARL'),
        ice: A.ice ?? '',
        rc: A.rc ?? '',
        city: A.city || 'Casablanca',
        address: A.address ?? '',
        phone: A.phone ?? '',
        email: A.email ?? '',
        plan: A.plan || 'pro',
        period: A.period || 'month',
        trial_days: A.trial ?? 14,
        tva: A.tva ?? 20,
        rules_json: RULES,
        state_snapshot: { V, DOCS, C, R, M, SIN, RULES },
        updated_at: new Date().toISOString()
      }])
    });
    if (!agRes.ok) throw new Error('HTTP ' + agRes.status);

    // 2. Synchronisation relationnelle complète (ajout, mise à jour ET suppression via ?sync=full)
    await Promise.all([
      fetch(base + '/vehicles?on_conflict=agency_id,id&sync=full', {
        method: 'POST', headers: dbHeaders(),
        body: JSON.stringify(V.map(v => ({
          id: v.id, agency_id: DB.agencyId, plate: v.plate, brand: v.brand, model: v.model,
          year: v.year, color: v.color, fuel: v.fuel, box: v.box, vin: v.vin, km: v.km,
          buy_date: v.buy, buy_price: v.price, supplier: v.supplier, warranty_end: v.warranty,
          daily_rate: v.daily, status: v.status
        })))
      }),
      fetch(base + '/vehicle_documents?on_conflict=agency_id,id&sync=full', {
        method: 'POST', headers: dbHeaders(),
        body: JSON.stringify(DOCS.map(d => ({
          id: d.id, agency_id: DB.agencyId, vid: d.vid, kind: d.kind,
          due_date: d.due, org: d.org, cost: d.cost
        })))
      }),
      fetch(base + '/clients?on_conflict=agency_id,id&sync=full', {
        method: 'POST', headers: dbHeaders(),
        body: JSON.stringify(C.map(c => ({
          id: c.id, agency_id: DB.agencyId, name: c.name, phone: c.phone,
          cin: c.cin, licence: c.lic, email: c.mail, since_date: c.since
        })))
      }),
      fetch(base + '/rentals?on_conflict=agency_id,id&sync=full', {
        method: 'POST', headers: dbHeaders(),
        body: JSON.stringify(R.map(r => ({
          id: r.id, agency_id: DB.agencyId, vid: r.vid, cid: r.cid,
          date_from: r.from, date_to: r.to, daily_rate: r.daily, deposit: r.dep,
          km_out: r.kmOut || 0, km_in: r.kmIn || null, place: r.place || 'Agence Casablanca'
        })))
      }),
      fetch(base + '/maintenances?on_conflict=agency_id,id&sync=full', {
        method: 'POST', headers: dbHeaders(),
        body: JSON.stringify(M.map(m => ({
          id: m.id, agency_id: DB.agencyId, vid: m.vid, maint_date: m.date,
          type: m.type, description: m.desc, cost: m.cost, garage: m.garage,
          km: m.km || 0, status: m.status
        })))
      }),
      fetch(base + '/claims?on_conflict=agency_id,id&sync=full', {
        method: 'POST', headers: dbHeaders(),
        body: JSON.stringify(SIN.map(s => ({
          id: s.id, agency_id: DB.agencyId, vid: s.vid, claim_date: s.date,
          ref: s.ref, driver: s.driver, place: s.place, responsibility: s.resp,
          damage: s.dmg, amount: s.amount, insurer: s.insurer, status: s.status
        })))
      })
    ]);
    DB.lastSync = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    saveDbConfig();
    if (!silent) { render(); toast('Synchronisation PostgreSQL réussie (' + V.length + ' véhicules)'); }
    return true;
  } catch (err) {
    if (!silent) toast('Erreur de synchronisation PostgreSQL : vérifiez la connexion au serveur');
    return false;
  }
}

async function pullFromCloud(silent = false) {
  if (!DB.url || (!DB.key && !DB.token) || !DB.agencyId) return false;
  const base = DB.url.replace(/\/+$/, '') + '/rest/v1';
  const authHeaders = { 'apikey': DB.key, 'Authorization': 'Bearer ' + (DB.token || DB.key) };
  try {
    const [agRes, vRes, dRes, cRes, rRes, mRes, sRes] = await Promise.all([
      fetch(base + '/agencies?id=eq.' + DB.agencyId + '&select=*', { headers: authHeaders }),
      fetch(base + '/vehicles', { headers: authHeaders }),
      fetch(base + '/vehicle_documents', { headers: authHeaders }),
      fetch(base + '/clients', { headers: authHeaders }),
      fetch(base + '/rentals', { headers: authHeaders }),
      fetch(base + '/maintenances', { headers: authHeaders }),
      fetch(base + '/claims', { headers: authHeaders })
    ]);
    if (!agRes.ok) return false;
    const rows = await agRes.json();
    const ag = rows && rows[0];
    if (!ag) return false;

    const [vRows, dRows, cRows, rRows, mRows, sRows] = await Promise.all([
      vRes.ok ? vRes.json() : [],
      dRes.ok ? dRes.json() : [],
      cRes.ok ? cRes.json() : [],
      rRes.ok ? rRes.json() : [],
      mRes.ok ? mRes.json() : [],
      sRes.ok ? sRes.json() : []
    ]);

    const snap = typeof ag.state_snapshot === 'string' ? JSON.parse(ag.state_snapshot || '{}') : (ag.state_snapshot || {});
    const fmtDate = val => val ? String(val).slice(0, 10) : '';

    // Toujours remplacer les tableaux en mémoire par les données PostgreSQL (même si l'agence a 0 véhicule)
    V.length = 0;
    if (Array.isArray(vRows) && vRows.length) {
      V.push(...vRows.map(v => ({
        id: v.id, plate: v.plate, brand: v.brand, model: v.model, year: +v.year || 2026,
        color: v.color || '', fuel: v.fuel || 'Diesel', box: v.box || 'Manuelle', vin: v.vin || '',
        km: +v.km || 0, buy: fmtDate(v.buy_date || v.buy), price: +(v.buy_price ?? v.price ?? 0),
        supplier: v.supplier || '', warranty: fmtDate(v.warranty_end || v.warranty),
        daily: +(v.daily_rate ?? v.daily ?? 250), status: v.status || 'available'
      })));
    } else if (Array.isArray(snap.V)) {
      V.push(...snap.V);
    }

    DOCS.length = 0;
    if (Array.isArray(dRows) && dRows.length) {
      DOCS.push(...dRows.map(d => ({
        id: d.id, vid: d.vid, kind: d.kind, due: fmtDate(d.due_date || d.due), org: d.org || '', cost: +d.cost || 0
      })));
    } else if (Array.isArray(snap.DOCS)) {
      DOCS.push(...snap.DOCS);
    }

    C.length = 0;
    if (Array.isArray(cRows) && cRows.length) {
      C.push(...cRows.map(c => ({
        id: c.id, name: c.name, phone: c.phone, cin: c.cin, lic: c.licence || c.lic || '',
        mail: c.email || c.mail || '', since: fmtDate(c.since_date || c.since)
      })));
    } else if (Array.isArray(snap.C)) {
      C.push(...snap.C);
    }

    R.length = 0;
    if (Array.isArray(rRows) && rRows.length) {
      R.push(...rRows.map(r => ({
        id: r.id, vid: r.vid, cid: r.cid, from: fmtDate(r.date_from || r.from), to: fmtDate(r.date_to || r.to),
        daily: +(r.daily_rate ?? r.daily ?? 250), dep: +(r.deposit ?? r.dep ?? 3000),
        kmOut: +(r.km_out ?? r.kmOut ?? 0), kmIn: (r.km_in ?? r.kmIn) != null ? +(r.km_in ?? r.kmIn) : undefined,
        place: r.place || 'Agence Casablanca'
      })));
    } else if (Array.isArray(snap.R)) {
      R.push(...snap.R);
    }

    M.length = 0;
    if (Array.isArray(mRows) && mRows.length) {
      M.push(...mRows.map(m => ({
        id: m.id, vid: m.vid, date: fmtDate(m.maint_date || m.date), type: m.type,
        desc: m.description ?? m.desc ?? '', cost: +m.cost || 0, garage: m.garage || '',
        km: +m.km || 0, status: m.status || 'open'
      })));
    } else if (Array.isArray(snap.M)) {
      M.push(...snap.M);
    }

    SIN.length = 0;
    if (Array.isArray(sRows) && sRows.length) {
      SIN.push(...sRows.map(s => ({
        id: s.id, vid: s.vid, date: fmtDate(s.claim_date || s.date), ref: s.ref,
        driver: s.driver || '', place: s.place || '', resp: s.responsibility || s.resp || 'Tiers',
        dmg: s.damage || s.dmg || '', amount: +s.amount || 0, insurer: s.insurer || '', status: s.status || 'open'
      })));
    } else if (Array.isArray(snap.SIN)) {
      SIN.push(...snap.SIN);
    }

    const rulesArr = ag.rules_json || snap.RULES;
    if (Array.isArray(rulesArr) && rulesArr.length) {
      RULES.length = 0;
      RULES.push(...rulesArr);
    }

    A.isDemo = false;
    A.company = ag.company || A.company;
    A.user = ag.owner_name || A.user;
    A.city = ag.city || A.city || 'Casablanca';
    A.legalName = ag.legal_name ?? '';
    A.ice = ag.ice ?? '';
    A.rc = ag.rc ?? '';
    A.address = ag.address ?? '';
    A.phone = ag.phone ?? '';
    A.email = ag.email ?? A.email;
    A.plan = ag.plan || A.plan;
    A.period = ag.period || A.period || 'month';
    A.trial = ag.trial_days != null ? +ag.trial_days : A.trial;
    A.tva = ag.tva != null ? +ag.tva : 20;

    DB.lastSync = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    saveDbConfig();
    try { localStorage.setItem('parcauto_state_v1', JSON.stringify({ V, DOCS, C, R, M, SIN, A, RULES })); } catch (e) {}
    render();
    if (!silent) toast('Données chargées depuis PostgreSQL');
    return true;
  } catch (e) {
    return false;
  }
}

/* ============ PERSISTANCE & FONCTIONS COMPLÉMENTAIRES ============ */
const DEFAULT_SNAPSHOT = JSON.stringify({ V, DOCS, C, R, M, SIN, A, RULES });
function saveState() {
  try {
    localStorage.setItem('parcauto_state_v1', JSON.stringify({ V, DOCS, C, R, M, SIN, A, RULES }));
  } catch (e) {}
  if (DB.url && DB.key) { syncToCloud(true); }
}
function loadState() {
  try {
    const raw = localStorage.getItem('parcauto_state_v1');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data.V)) { V.length = 0; V.push(...data.V); }
    if (Array.isArray(data.DOCS)) { DOCS.length = 0; DOCS.push(...data.DOCS); }
    if (Array.isArray(data.C)) { C.length = 0; C.push(...data.C); }
    if (Array.isArray(data.R)) { R.length = 0; R.push(...data.R); }
    if (Array.isArray(data.M)) { M.length = 0; M.push(...data.M); }
    if (Array.isArray(data.SIN)) { SIN.length = 0; SIN.push(...data.SIN); }
    if (Array.isArray(data.RULES) && data.RULES.length) { RULES.length = 0; RULES.push(...data.RULES); }
    if (data.A) Object.assign(A, data.A);
  } catch (e) {}
}
function resetState() {
  try { localStorage.removeItem('parcauto_state_v1'); } catch (e) {}
  const def = JSON.parse(DEFAULT_SNAPSHOT);
  V.length = 0; V.push(...def.V);
  DOCS.length = 0; DOCS.push(...def.DOCS);
  C.length = 0; C.push(...def.C);
  R.length = 0; R.push(...def.R);
  M.length = 0; M.push(...def.M);
  SIN.length = 0; SIN.push(...def.SIN);
  RULES.length = 0; RULES.push(...def.RULES);
  Object.assign(A, def.A, { mode: 'app' });
  render();
  toast('Données de démonstration réinitialisées');
}
loadState();

function downloadFile(filename, content, mime = 'text/csv;charset=utf-8;') {
  const blob = new Blob(['\uFEFF' + content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 200);
}

function exportReport(kind) {
  if (kind === 'rentals') {
    const head = 'N° Contrat;Client;Téléphone;Véhicule;Immatriculation;Du;Au;Tarif/jour (DH);Total TTC (DH);Caution (DH);Statut\n';
    const rows = R.map(r => `${r.id};${cli(r.cid).name};${cli(r.cid).phone};${vname(veh(r.vid))};${veh(r.vid).plate};${r.from};${r.to};${r.daily};${rTotal(r)};${r.dep};${statLabel(rentalState(r))}`).join('\n');
    downloadFile('journal-locations-parcauto.csv', head + rows);
    toast('Journal des locations exporté (CSV)');
  } else if (kind === 'costs') {
    const head = 'Immatriculation;Véhicule;Année;Kilométrage;Revenus (DH);Charges cumulées (DH);Marge nette (DH)\n';
    const rows = V.map(v => `${v.plate};${vname(v)};${v.year};${v.km};${revOf(v.id)};${costOf(v.id)};${revOf(v.id) - costOf(v.id)}`).join('\n');
    downloadFile('charges-rentabilite-vehicules.csv', head + rows);
    toast('Charges par véhicule exportées (CSV/Excel)');
  } else if (kind === 'docs') {
    const head = 'Document;Immatriculation;Véhicule;Organisme;Échéance;Jours restants;Coût (DH)\n';
    const rows = DOCS.map(d => `${t(DOCLBL[d.kind])};${veh(d.vid).plate};${vname(veh(d.vid))};${d.org};${d.due};${days(d.due)};${d.cost}`).join('\n');
    downloadFile('echeancier-documents-parcauto.csv', head + rows);
    toast('Échéancier documentaire exporté');
  } else if (kind === 'accounting') {
    const head = 'Type;Référence;Date;Véhicule;Tiers;Montant TTC (DH);TVA 20% (DH)\n';
    const rRows = R.map(r => `Recette location;${r.id};${r.from};${veh(r.vid).plate};${cli(r.cid).name};${rTotal(r)};${Math.round(rTotal(r) - rTotal(r)/1.2)}`);

    downloadFile('export-comptable-parcauto.csv', head + [...rRows, ...mRows].join('\n'));
    toast('Export comptable téléchargé');
  }
}

function importJsonFlow() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result || '{}'));
        if (Array.isArray(data.V)) { V.length = 0; V.push(...data.V); }
        if (Array.isArray(data.DOCS)) { DOCS.length = 0; DOCS.push(...data.DOCS); }
        if (Array.isArray(data.C)) { C.length = 0; C.push(...data.C); }
        if (Array.isArray(data.R)) { R.length = 0; R.push(...data.R); }
        if (Array.isArray(data.M)) { M.length = 0; M.push(...data.M); }
        if (Array.isArray(data.SIN)) { SIN.length = 0; SIN.push(...data.SIN); }
        if (data.A) Object.assign(A, data.A, { mode: 'app' });
        saveState(); render();
        toast('Sauvegarde restaurée avec succès (' + V.length + ' véhicules)');
      } catch (err) {
        toast('Fichier JSON invalide');
      }
    };
    reader.readAsText(file);
  };
  inp.click();
}

      <div class="row" style="justify-content:space-between;flex-wrap:wrap">
        <div>
          <b style="font-family:var(--f-display);font-size:19px">👑 Console Propriétaire ParcAuto — Gestion des Agences Clientes</b>
          <div class="muted small">Créez des comptes pour vos clients, choisissez leur formule, envoyez leurs accès sur WhatsApp et gérez leurs abonnements.</div>
        </div>
        <span class="pill ok">Propriétaire</span>
      </div>
    </div>

    <div class="dbody" style="padding:12px 22px 20px;gap:16px">
      <div class="card" style="padding:12px 16px;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,var(--line))">
        <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
          <div><b style="color:var(--accent-ink);font-size:13px">⚡ Pilote Automatique SaaS activé</b><div class="muted small">1. Inscription client auto (14j) · 2. Activation auto après paiement en ligne (`/api/webhooks/payment`) · 3. Suspension auto à 0 jour.</div></div>
          <span class="pill ok">100 % Automatisé</span>
        </div>
      </div>
      <div class="card" style="background:var(--surface-2)">
        <h3>➕ Donner l'accès à une nouvelle agence cliente</h3>
        <div class="formgrid" style="padding:14px">
          <label class="fld">Nom de l'agence<input type="text" id="sa-co" placeholder="Ex. Rif Auto Rent"></label>
          <label class="fld">Ville<input type="text" id="sa-ct" value="Casablanca"></label>
          <label class="fld">Téléphone WhatsApp du gérant<input type="text" id="sa-ph" placeholder="+212 6..."></label>
          <label class="fld">Formule attribuée<select id="sa-pl">
            <option value="essentiel">Essentiel — 299 DH/mois (≤ 15 véh.)</option>
            <option value="pro" selected>Pro — 599 DH/mois (≤ 50 véh.)</option>
            <option value="business">Business — 1190 DH/mois (Illimité)</option>
          </select></label>
          <label class="fld">Email de connexion du client<input type="text" id="sa-em" placeholder="gerant@agence.ma"></label>
          <label class="fld">Mot de passe provisoire<input type="text" id="sa-pw" value="ParcAuto2026"></label>
          <label class="fld">Durée d'accès (jours)<select id="sa-tr">
            <option value="14">14 jours (Essai gratuit)</option>
            <option value="30" selected>30 jours (Abonnement mensuel payé)</option>
            <option value="365">365 jours (Abonnement annuel payé)</option>
          </select></label>
          <label class="fld">Clé Propriétaire (Serveur)<input type="password" id="sa-key" value="${esc(adminKey)}"></label>
          <div class="full row" style="justify-content:flex-end;gap:8px;margin-top:4px">
            <button class="tbtn primary" id="sa-create">✓ Créer le compte agence & Générer l'invitation</button>
          </div>
          <div class="full" id="sa-invite-box" style="display:none"></div>
        </div>
      </div>

      <div class="card">
        <h3>🏢 Agences clientes inscrites (<span id="sa-count">${localAgencies.length}</span>)</h3>
        <div class="tscroll">
          <table>
            <thead><tr><th>Agence</th><th>Email (Identifiant)</th><th>Formule</th><th>Jours restants</th><th>Statut</th><th>Actions</th></tr></thead>
            <tbody id="sa-list"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="tbtn" id="cx">${t('close')}</button>
    </div>
  </div></div>`);

  const renderAgenciesList = (list) => {
    node.querySelector('#sa-count').textContent = list.length;
    const tbody = node.querySelector('#sa-list');
    tbody.innerHTML = list.map((ag, idx) => `<tr>
      <td><div class="stack"><b style="font-weight:600">${esc(ag.company)}</b><span class="muted small">${esc(ag.city || '')} · ${esc(ag.phone || '')}</span></div></td>
      <td class="num">${esc(ag.email)}</td>
      <td>
        <select data-sa-plan="${idx}" style="padding:4px 8px;font-size:12px">
          <option value="essentiel" ${ag.plan === 'essentiel' ? 'selected' : ''}>Essentiel (299 DH)</option>
          <option value="pro" ${ag.plan === 'pro' ? 'selected' : ''}>Pro (599 DH)</option>
          <option value="business" ${ag.plan === 'business' ? 'selected' : ''}>Business (1190 DH)</option>
        </select>
      </td>
      <td class="num">${ag.trial_days ?? 30} j</td>
      <td><span class="pill ${ag.suspended ? 'crit' : 'ok'}">${ag.suspended ? 'Suspendu' : 'Actif'}</span></td>
      <td>
        <div class="row" style="gap:6px">
          <button class="tbtn" data-sa-add30="${idx}" title="Ajouter 30 jours d'abonnement">+30j</button>
          <button class="tbtn" data-sa-wa="${idx}" title="Envoyer les accès sur WhatsApp">📲 WhatsApp</button>
          <button class="tbtn" data-sa-toggle="${idx}">${ag.suspended ? 'Réactiver' : 'Suspendre'}</button>
        </div>
      </td>
    </tr>`).join('') || '<tr><td colspan="6"><div class="empty">Aucune agence</div></td></tr>';

    tbody.querySelectorAll('[data-sa-plan]').forEach(sel => sel.onchange = async () => {
      const ag = list[+sel.dataset.saPlan];
      ag.plan = sel.value;
      localStorage.setItem('parcauto_admin_agencies', JSON.stringify(list));
      if (DB.url) {
        try {
          await fetch(DB.url.replace(/\/+$/, '') + '/api/admin/update-agency', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': node.querySelector('#sa-key').value.trim() },
            body: JSON.stringify({ agency_id: ag.id, plan: ag.plan })
          });
        } catch (e) {}
      }
      toast('Formule de ' + ag.company + ' passée en ' + planOf(ag.plan).name);
    });

    tbody.querySelectorAll('[data-sa-toggle]').forEach(btn => btn.onclick = async () => {
      const ag = list[+btn.dataset.saToggle];
      ag.suspended = !ag.suspended;
      localStorage.setItem('parcauto_admin_agencies', JSON.stringify(list));
      if (DB.url) {
        try {
          await fetch(DB.url.replace(/\/+$/, '') + '/api/admin/update-agency', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': node.querySelector('#sa-key').value.trim() },
            body: JSON.stringify({ agency_id: ag.id, suspended: ag.suspended })
          });
        } catch (e) {}
      }
      renderAgenciesList(list);
      toast(ag.suspended ? 'Accès suspendu pour ' + ag.company : 'Accès réactivé pour ' + ag.company);
    });

    tbody.querySelectorAll('[data-sa-add30]').forEach(btn => btn.onclick = async () => {
      const ag = list[+btn.dataset.saAdd30];
      ag.trial_days = (ag.trial_days || 0) + 30;
      ag.suspended = false;
      localStorage.setItem('parcauto_admin_agencies', JSON.stringify(list));
      if (DB.url) {
        try {
          await fetch(DB.url.replace(/\/+$/, '') + '/api/admin/update-agency', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-key': node.querySelector('#sa-key').value.trim() },
            body: JSON.stringify({ agency_id: ag.id, trial_days: ag.trial_days, suspended: false })
          });
        } catch (e) {}
      }
      renderAgenciesList(list);
      toast('+30 jours crédités automatiquement pour ' + ag.company);
    });

    tbody.querySelectorAll('[data-sa-wa]').forEach(btn => btn.onclick = () => {
      const ag = list[+btn.dataset.saWa];
      const siteUrl = location.origin && location.protocol.startsWith('http') ? location.origin : 'https://parcauto.ma';
      const msg = `Bonjour ${ag.company},\nVotre espace de gestion ParcAuto Maroc (Formule ${planOf(ag.plan).name}) est activé !\n\n🌐 Lien de connexion : ${siteUrl}\n📧 Email : ${ag.email}\n🔑 Mot de passe : ${ag.password || 'ParcAuto2026'}\n\nBonne gestion !`;
      const phone = (ag.phone || '').replace(/\D+/g, '');
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    });
  };

  renderAgenciesList(localAgencies);

  // Try loading live list from server.js if running
  if (DB.url) {
    fetch(DB.url.replace(/\/+$/, '') + '/api/admin/overview', {
      headers: { 'x-admin-key': adminKey }
    }).then(r => r.ok ? r.json() : null).then(data => {
      if (data && Array.isArray(data.agencies) && data.agencies.length) {
        localAgencies = data.agencies;
        renderAgenciesList(localAgencies);
      }
    }).catch(() => {});
  }

  node.querySelector('#sa-create').onclick = async () => {
    const company = node.querySelector('#sa-co').value.trim() || 'Agence Auto';
    const city = node.querySelector('#sa-ct').value.trim() || 'Casablanca';
    const phone = node.querySelector('#sa-ph').value.trim() || '+212 600 00 00 00';
    const plan = node.querySelector('#sa-pl').value;
    const email = node.querySelector('#sa-em').value.trim().toLowerCase();
    const password = node.querySelector('#sa-pw').value.trim();
    const trial_days = +node.querySelector('#sa-tr').value || 30;
    const keyVal = node.querySelector('#sa-key').value.trim() || 'ADMIN2026';
    localStorage.setItem('parcauto_admin_key', keyVal);

    if (!email || !email.includes('@')) { toast('Veuillez saisir l\'email du gérant'); return; }
    if (password.length < 6) { toast('Le mot de passe doit faire au moins 6 caractères'); return; }

    let createdId = 'ag-' + Date.now();
    if (DB.url) {
      try {
        const res = await fetch(DB.url.replace(/\/+$/, '') + '/api/admin/create-agency', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-key': keyVal },
          body: JSON.stringify({ email, password, company, city, phone, plan, trial_days })
        });
        const data = await res.json();
        if (res.ok && data.user) createdId = data.user.id;
      } catch (e) {}
    }

    const newAg = { id: createdId, company, city, phone, email, password, plan, trial_days, suspended: false, empty_fleet: true };
    localAgencies.unshift(newAg);
    localStorage.setItem('parcauto_admin_agencies', JSON.stringify(localAgencies));
    renderAgenciesList(localAgencies);

    const siteUrl = location.origin && location.protocol.startsWith('http') ? location.origin : 'https://parcauto.ma';
    const inviteTxt = `Bonjour ${company},
Votre compte ParcAuto Maroc (Formule ${planOf(plan).name} — ${trial_days} jours) est prêt !

🌐 Lien : ${siteUrl}
📧 Email : ${email}
🔑 Mot de passe : ${password}

Connectez-vous en cliquant sur « Se connecter » en haut à droite.`;
    const box = node.querySelector('#sa-invite-box');
    box.style.display = 'block';
    box.innerHTML = `<div class="card" style="padding:12px 14px;border-color:var(--ok);background:var(--ok-soft)">
      <div style="font-weight:600;color:var(--ok);margin-bottom:6px">✓ Accès créé pour ${esc(company)} ! Envoyez ces identifiants au gérant :</div>
      <pre style="margin:0 0 10px;white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--surface);padding:10px;border-radius:8px">${esc(inviteTxt)}</pre>
      <div class="row" style="gap:8px">
        <button class="tbtn primary" id="sa-send-wa">📲 Envoyer sur WhatsApp au gérant</button>
        <button class="tbtn" id="sa-copy-inv">📋 Copier les identifiants</button>
      </div>
    </div>`;
    box.querySelector('#sa-send-wa').onclick = () => {
      const ph = phone.replace(/\D+/g, '');
      window.open(`https://wa.me/${ph}?text=${encodeURIComponent(inviteTxt)}`, '_blank');
    };
    box.querySelector('#sa-copy-inv').onclick = () => {
      try { navigator.clipboard.writeText(inviteTxt); } catch (e) {}
      toast('Identifiants copiés dans le presse-papiers');
    };
    toast('Compte agence créé avec succès !');
  };

  node.onclick = e => { if (e.target === node) closeLayer(); };
  node.querySelector('#cx').onclick = closeLayer;
  openLayer(node);
}

/* ============ ÉVÉNEMENTS GLOBAUX ============ */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-veh],[data-rental],[data-contract],[data-renew],[data-notify],[data-go],[data-sim],[data-new-veh],[data-edit-veh],[data-add-doc],[data-new-cli],[data-edit-cli],[data-return],[data-new-maint],[data-close-maint],[data-new-claim],[data-close-claim],[data-rule-toggle],[data-edit-agency],[data-export-json],[data-import-json],[data-clear-fleet],[data-reset-demo],[data-export],[data-pay-method],[data-invoices],[data-wa-real],[data-copy-msg],[data-contact-sales],[data-legal],[data-db-config],[data-db-sync],[data-db-sql],[data-super-admin]');
  if (!b) return;
  const d = b.dataset;
  if (d.newVeh) { vehicleForm(); return; }
  if (d.editVeh) { vehicleForm(d.editVeh); return; }
  if (d.addDoc) { addDocForm(d.addDoc); return; }
  if (d.newCli) { clientForm(); return; }
  if (d.editCli) { clientForm(d.editCli); return; }
  if (d.return) { e.stopPropagation(); returnRentalForm(d.return); return; }
  if (d.newMaint) { newMaintForm(); return; }
  if (d.closeMaint) { e.stopPropagation(); const m = M.find(x => x.id === d.closeMaint); if (m) { m.status = 'closed'; if (veh(m.vid).status === 'service') veh(m.vid).status = 'available'; saveState(); render(); toast('Intervention clôturée — véhicule disponible'); } return; }
  if (d.newClaim) { newClaimForm(); return; }
  if (d.closeClaim) { e.stopPropagation(); const s = SIN.find(x => x.id === d.closeClaim); if (s) { s.status = 'closed'; saveState(); render(); toast('Dossier sinistre clos'); } return; }
  if (d.ruleToggle != null) { const r = RULES[+d.ruleToggle]; if (r) { r[4] = r[4] === 'ok' ? 'warn' : 'ok'; saveState(); render(); toast('Règle mise à jour'); } return; }
  if (d.editAgency) { editAgencyForm(); return; }
  if (d.exportJson) { downloadFile('parcauto-backup.json', JSON.stringify({ V, DOCS, C, R, M, SIN, A }, null, 2), 'application/json'); toast('Sauvegarde JSON téléchargée'); return; }
  if (d.importJson) { importJsonFlow(); return; }
  if (d.clearFleet) { clearFleetModal(); return; }
  if (d.resetDemo) { resetState(); return; }
  if (d.export) { exportReport(d.export); return; }
  if (d.payMethod) { paymentMethodModal(); return; }
  if (d.invoices) { invoicesModal(); return; }
  if (d.contactSales) { contactSalesModal(); return; }
  if (d.legal) { legalModal(d.legal); return; }
  if (d.dbConfig) { dbConfigModal(); return; }
  if (d.dbSync) { syncToCloud(false); return; }
  if (d.dbSql) { dbSqlModal(); return; }
  if (d.superAdmin) { superAdminModal(); return; }
  if (d.waReal) {
    const r = R.find(x => x.id === d.waReal);
    if (r) {
      const isEnd = rentalState(r) === 'active' && days(r.to) <= 3;
      const txt = isEnd ? msgEnd(r) : msgStart(r);
      const phone = (cli(r.cid).phone || '').replace(/\D+/g, '');
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(txt)}`, '_blank');
      closeLayer(); toast(t('treated'));
    }
    return;
  }
  if (d.copyMsg) {
    const r = R.find(x => x.id === d.copyMsg);
    if (r) {
      const isEnd = rentalState(r) === 'active' && days(r.to) <= 3;
      const txt = isEnd ? msgEnd(r) : msgStart(r);
      try { navigator.clipboard.writeText(txt); } catch (err) {}
      toast('Message copié dans le presse-papiers');
    }
    return;
  }
  if (d.sim) { closeLayer(); toast(t('treated')); return; }
  if (d.go) { S.view = d.go; render(); return; }
  if (d.renew) { e.stopPropagation(); const doc = DOCS.find(x => x.id === d.renew); const nd = new Date(Math.max(D(doc.due), TODAY)); nd.setFullYear(nd.getFullYear() + 1); doc.due = iso(nd); saveState(); render(); toast(t('renewed')); return; }
  if (d.notify) { e.stopPropagation(); notifySheet(d.notify); return; }
  if (d.contract) { e.stopPropagation(); contractSheet(d.contract); return; }
  if (d.rental) { contractSheet(d.rental); return; }
  if (d.veh) { vehicleDrawer(d.veh); return; }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; const p = e.target.selectionStart; render(); const n = $('#q'); if (n) { n.focus(); n.setSelectionRange(p, p); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLayer(); });

render();

</script>

</body></html>
